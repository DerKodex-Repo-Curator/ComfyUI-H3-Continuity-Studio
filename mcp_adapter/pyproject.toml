[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3c-mcp"
version = "0.1.0"
description = "Standalone MCP adapter for H3 Continuity Studio"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx2>=2.10,<3"]

[project.scripts]
h3c-mcp = "h3c_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
